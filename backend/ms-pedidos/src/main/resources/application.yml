server:
  port: ${PORT:8082}

spring:
  application:
    name: ms-pedidos
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/oyl_pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  products:
    base-url: ${PRODUCTS_BASE_URL:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
